name: Ruby CI

on:
  push:
    branches: [ "master" ]
  # Every pull request, whatever its base. This fork's work lands on its own
  # branches (client-supplied-public-key, peer-teardown-and-retention), never
  # on master, so upstream's filter meant its PRs were never checked at all.
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Run cops
        run: bundle exec rubocop

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Run specs
        run: bundle exec rspec
